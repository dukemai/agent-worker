name = "email-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-08-01"

# Email Worker binding - required for sending emails from the worker
# (e.g., replies, forwarding). For local dev, wrangler simulates this.
[[send_email]]
name = "EMAIL"

# Cron triggers
# Run at both possible UTC offsets; the handler gates on 06:30 Europe/Stockholm.
# Daily: growing ingest + daily digest
# Sun/Wed: growing suggestions (generates growing_suggestions_log for the week)
# Daily recipe and activity-source import queues
# Sunday weekly planning at 19:30 Europe/Stockholm (both UTC offsets, locally gated)
[triggers]
crons = ["15 3 * * *", "45 3 * * *", "30 4 * * *", "30 5 * * *", "30 5 * * Sun,Wed", "30 17 * * Sun", "30 18 * * Sun"]
